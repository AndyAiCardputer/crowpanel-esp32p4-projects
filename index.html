<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrowPanel ESP32-P4 - Web Flasher</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a2e;
            color: #e0e0e0;
        }
        .container {
            background: #16213e;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        h1 { color: #e94560; margin-top: 0; }
        a { color: #53a8b6; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .project-card {
            background: #0f3460;
            border-radius: 8px;
            padding: 20px;
            margin: 15px 0;
            border-left: 4px solid #e94560;
        }
        .project-card h3 {
            margin-top: 0;
            color: #e94560;
        }
        .flash-link {
            display: inline-block;
            background: #e94560;
            color: white;
            padding: 8px 20px;
            border-radius: 4px;
            margin-top: 10px;
            font-weight: bold;
        }
        .flash-link:hover {
            background: #c73652;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CrowPanel ESP32-P4 Projects</h1>
        <p>Web Flasher for CrowPanel Advanced 10.1" ESP32-P4 HMI Display</p>

        <div class="project-card">
            <h3>Crown NES -- NES Emulator</h3>
            <p>NES emulator with ROM browser from SD card and USB gamepad support (PS5 DualSense via Steam Deck Dock). 1024x600 display, 4:3 scaling.</p>
            <a href="crown_nes/" class="flash-link">Flash Now</a>
        </div>

        <p style="margin-top: 30px; color: #666;">
            <a href="https://github.com/AndyAiCardputer/crowpanel-esp32p4-projects">Source Code on GitHub</a>
            | <a href="https://www.youtube.com/@AndyAiCardputer">YouTube</a>
        </p>
    </div>

</html>
